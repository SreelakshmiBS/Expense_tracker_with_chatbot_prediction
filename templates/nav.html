<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navigation Bar — SmartExpenseAI (Flask/Jinja)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  /* -- RESET & BASE (minimal, only needed for nav context) -- */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #f4f3ef;  /* just for demo contrast */
    min-height: 100vh;
  }

  /* -- TOKENS (matching original design) -- */
  :root {
    --bg:        #ffffff;
    --bg-off:    #fafaf8;
    --bg-light:  #f4f3ef;
    --border-s:  #f0ede6;
    --border:    #e8e6e0;

    --t1: #1a1816;
    --t2: #2d2b28;
    --t3: #6b6560;
    --t4: #a8a29c;

    --gold:    #c9a96e;
    --gold-dk: #9d7c47;
    --gold-lt: #e0c27a;
    --gold-bg: #f5eedf;

    --sh-sm: 0 2px 12px rgba(26,24,22,.06);
    --r:  10px;
    --rl: 18px;
  }

  .serif {
    font-family: 'Cormorant Garamond', serif;
  }

  /* =============================================== */
  /* CORRECTED / FIXED NAVIGATION STYLES            */
  /* (matches the latest Jinja version you shared)  */
  /* =============================================== */
  
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    backdrop-filter: blur(20px) saturate(1.5);
    -webkit-backdrop-filter: blur(20px) saturate(1.5);
    background: rgba(255, 255, 255, 0.78);
    border-bottom: 1px solid var(--border-s);
    transition: box-shadow 0.3s;
  }

  .navbar.scrolled {
    box-shadow: var(--sh-sm);
  }

  .nav-container {
    max-width: 1140px;
    margin: 0 auto;
    padding: 0 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 62px;
  }

  .brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;
    font-weight: 600;
    color: var(--t1);
    text-decoration: none;
    letter-spacing: -0.3px;
  }

  .brand span {
    color: var(--gold);
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  /* Analytics button */
  .analytics-btn {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--t2);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: var(--r);
    transition: all 0.2s ease;
    background: transparent;
  }
  
  .analytics-btn:hover {
    background: var(--gold-bg);
    color: var(--gold-dk);
  }

  /* Avatar (profile circle) */
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-bg) 0%, var(--gold-lt) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    border: 1px solid rgba(201, 169, 110, 0.3);
  }
  
  .avatar a {
    font-size: 14px;
    font-weight: 600;
    color: var(--gold-dk);
    text-decoration: none;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    border-radius: 50%;
  }
  
  .avatar:hover {
    transform: scale(1.03);
    background: var(--gold);
    border-color: var(--gold);
  }
  
  .avatar:hover a {
    color: var(--t1);
  }

  /* Logout button */
  .logout-btn {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--t3);
    text-decoration: none;
    padding: 6px 14px;
    border-radius: var(--r);
    transition: all 0.2s ease;
    background: transparent;
    border: 1px solid transparent;
  }
  
  .logout-btn:hover {
    background: rgba(184, 84, 80, 0.08);
    color: var(--red, #b85450);
    border-color: rgba(184, 84, 80, 0.2);
  }

  /* demo spacer so we can see fixed nav */
  .demo-placeholder {
    height: 120vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 100px;
    color: var(--t3);
    text-align: center;
    font-size: 14px;
  }
  .demo-card {
    background: var(--bg);
    border-radius: 20px;
    padding: 32px;
    box-shadow: var(--sh-sm);
    max-width: 560px;
    margin: 0 20px;
    border: 1px solid var(--border);
  }
  .demo-card code {
    background: var(--bg-off);
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 12px;
    color: var(--gold-dk);
  }
  .badge {
    background: var(--gold-bg);
    padding: 4px 12px;
    border-radius: 40px;
    font-size: 11px;
    font-weight: 500;
    display: inline-block;
    margin-top: 12px;
  }
  
  @media (max-width: 640px) {
    .nav-container {
      padding: 0 20px;
    }
    .analytics-btn {
      display: none;
    }
    .logout-btn {
      padding: 6px 10px;
    }
  }
</style>
</head>
<body>

<!-- ============================================== -->
<!-- EXTRACTED NAVIGATION (Flask / Jinja ready)     -->
<!-- Includes: dashboard link, analytics, avatar,   -->
<!-- logout, plus dynamic username placeholder      -->
<!-- ============================================== -->
<nav class="navbar" id="mainNavbar">
  <div class="nav-container">
    <a href="{{ url_for('dashboard') }}" class="brand">Smart<span>Expense</span>AI</a>
    <div class="nav-right">
      <a href="{{ url_for('analytics') }}" class="analytics-btn">Analytics</a>
      <div class="avatar">
        <a href="{{ url_for('profile') }}">{{ username[:2].upper() if username else 'PR' }}</a>
      </div>
      <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
    </div>
  </div>
</nav>
</body>
</html>
